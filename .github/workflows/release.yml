name: Release

# A device build (release_arm64) with the VLESS core embedded.
#  - Tag v* or manual run → IPA + dSYMs as artifacts; on a tag also a GitHub Release.
#  - With signing secrets the IPA is distribution-signed for org.ghostgram.app; without them it is
#    signed with build-system/fake-codesigning (ph.telegra.Telegraph) and must be re-signed by the
#    installer (AltStore, Sideloadly, …).
#  - Manual run with "testflight" and the App Store Connect secrets → upload to TestFlight.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (empty = commit count + build_number_offset)
        type: string
        default: ""
      testflight:
        description: Upload to TestFlight (needs real signing and the ASC_* secrets)
        type: boolean
        default: false
      vpn_core:
        description: Build and embed the VLESS core (GGXrayCore)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vpn-core:
    name: VLESS core (GGXrayCore)
    if: github.event_name == 'push' || inputs.vpn_core
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Ghostgram/Features/Vless/Core/go/go.mod
          cache-dependency-path: Ghostgram/Features/Vless/Core/go/go.sum
      - name: Select Xcode from versions.json
        run: |
          VERSION="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode"])' versions.json)"
          sudo xcode-select -s "/Applications/Xcode_${VERSION}.app/Contents/Developer"
      - name: Build
        run: Ghostgram/Features/Vless/Core/build-core.sh --simulator --force
      - uses: actions/upload-artifact@v4
        with:
          name: GGXrayCore
          path: Ghostgram/Features/Vless/Core/build/
          retention-days: 7

  ipa:
    name: Device IPA (release_arm64)
    needs: vpn-core
    # The core is optional: run when it was skipped, never when it failed.
    if: ${{ !cancelled() && (needs.vpn-core.result == 'success' || needs.vpn-core.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      BAZEL_CACHE: /Users/runner/telegram-bazel-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare
        id: prepare
        uses: ./.github/actions/gg-prepare
        with:
          api-id: ${{ secrets.GG_API_ID }}
          api-hash: ${{ secrets.GG_API_HASH }}
          team-id: ${{ secrets.GG_TEAM_ID }}
          signing-p12-base64: ${{ secrets.GG_SIGNING_P12_BASE64 }}
          profiles-zip-base64: ${{ secrets.GG_PROFILES_ZIP_BASE64 }}

      - name: VLESS core
        if: needs.vpn-core.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: GGXrayCore
          path: Ghostgram/Features/Vless/Core/build/

      - name: Version and build number
        run: |
          APP_VERSION="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"])' versions.json)"
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Ghostgram $APP_VERSION ($BUILD_NUMBER), signing: ${{ steps.prepare.outputs.signing }}"

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: bazel-release-${{ steps.prepare.outputs.xcode-version }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-release-${{ steps.prepare.outputs.xcode-version }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-
            bazel-release-${{ steps.prepare.outputs.xcode-version }}-

      - name: Build
        env:
          GG_BUILD_LOG: ${{ runner.temp }}/gg-build-release.log
        run: build-system/GGBuildRelease.sh "$BUILD_NUMBER"

      - name: Verify the VLESS core is embedded and loaded only by dlopen
        if: needs.vpn-core.result == 'success'
        run: Ghostgram/Features/Vless/Core/verify-core.sh build-output/ipa/Ghostgram.ipa

      - name: Package
        run: |
          OUT=build-output/ipa
          NAME="Ghostgram-${APP_VERSION}-${BUILD_NUMBER}"
          if [ "${{ steps.prepare.outputs.signing }}" = "fake" ]; then NAME="$NAME-unsigned"; fi
          mkdir -p release
          cp "$OUT/Ghostgram.ipa" "release/$NAME.ipa"
          if [ -d "$OUT/DSYMs" ]; then (cd "$OUT" && zip -qr "../../release/$NAME.dSYMs.zip" DSYMs); fi
          (cd release && shasum -a 256 * > SHA256SUMS.txt)
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: release/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-build-log
          path: ${{ runner.temp }}/gg-build-release.log
          if-no-files-found: ignore

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Ghostgram ${APP_VERSION} (${BUILD_NUMBER})."
          if [ "${{ steps.prepare.outputs.signing }}" = "fake" ]; then
            NOTE="$NOTE Signed with the test certificate: re-sign it when installing (AltStore, Sideloadly…)."
          fi
          gh release create "${GITHUB_REF_NAME}" release/* --title "Ghostgram ${GITHUB_REF_NAME}" \
            --notes "$NOTE" --verify-tag

      - name: TestFlight
        if: inputs.testflight && steps.prepare.outputs.signing == 'real'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 secrets are required for TestFlight."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 -I -c 'import json,os; json.dump({"keyId": os.environ["ASC_KEY_ID"], "issuerId": os.environ["ASC_ISSUER_ID"]}, open("build-system/ghostgram-appstoreconnect.json", "w"))'
          build-system/GGUploadTestFlight.sh build-output/ipa/Ghostgram.ipa

      - name: Save bazel cache
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE }}
          key: bazel-release-${{ steps.prepare.outputs.xcode-version }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}-${{ github.sha }}

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf build-system/ghostgram-codesigning build-system/ghostgram-appstoreconnect.json ~/.appstoreconnect
          security delete-keychain temp.keychain 2>/dev/null || true
